name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: python3 scripts/validate.py
      - name: shellcheck (preinstalled on ubuntu-latest)
        run: shellcheck -S warning scripts/*.sh templates/*.sh worktree-manager/scripts/*.sh
      - run: bash worktree-manager/scripts/worktree_test.sh
      - run: bash scripts/agent-guard_test.sh
      - run: bash scripts/scripts_test.sh
